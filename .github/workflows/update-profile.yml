name: Update Profile Metrics & Cards

on:
  schedule:
    # Run every 24 hours at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Fetch Live GitHub Data & Update Telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_github_data.py
          python scripts/generate_stats.py
          python scripts/generate_contributions.py
          python scripts/render_readme_cards.py
          python scripts/optimize_svgs.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add assets/ cards/ data/
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore(telemetry): automated refresh of profile cards and heatmaps [skip ci]"
            git push
          fi
