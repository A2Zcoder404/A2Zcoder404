<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya Nair — Activity Card Preview</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #e6edf3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .badge {
      background: #2f55ff;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      margin-left: 8px;
    }
    .card-wrap {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 930px;
      width: 100%;
      text-align: center;
    }
    .card-wrap.dark-canvas {
      background: #0d1117;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .meta {
      font-family: monospace;
      font-size: 12px;
      color: #8b949e;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>Aditya Nair (@A2ZCoder404) — Bespoke Activity Card <span class="badge">Avi Vashishta Aesthetic</span></h1>
  
  <div class="card-wrap dark-canvas">
    <div style="font-size: 13px; color: #8b949e; margin-bottom: 12px; text-align: left;">Preview on GitHub Dark Canvas:</div>
    <img src="cards/activity.svg" alt="Aditya Nair Activity SVG" />
    <div class="meta">880 × 352 px &bull; Embedded Fonts: Instrument Serif, Geist, Geist Mono &bull; Live Telemetry: 1,122 contributions, 370-day streak</div>
  </div>

  <div class="card-wrap">
    <div style="font-size: 13px; color: #52525b; margin-bottom: 12px; text-align: left;">Preview on GitHub Light Canvas:</div>
    <img src="cards/activity.svg" alt="Aditya Nair Activity SVG" />
  </div>
</body>
</html>
