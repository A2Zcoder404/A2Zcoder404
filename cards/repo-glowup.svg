<svg xmlns="http://www.w3.org/2000/svg" width="297.3333333333333" height="177" viewBox="0 0 297.3333333333333 177" role="img" aria-label="Repository: GlowUp">
  <defs>
    <style>
      
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.9); } }
@keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translate(3px, -3px); } }

.live { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.n { transform-box: fill-box; animation: nudge 2s ease-in-out infinite; }

      .rname { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15.5px; font-weight: 700; fill: #111111; }
      .stack { font-family: 'SF Mono', Monaco, 'Courier New', Courier, monospace; font-size: 9.5px; font-weight: 700; fill: #8b5cf6; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #52525b; line-height: 1.5; }
      .arrow { font-family: 'SF Mono', Monaco, 'Courier New', Courier, monospace; font-size: 11px; font-weight: 700; fill: #8b5cf6; }
    </style>
  </defs>

  <g transform="translate(12 0)">
    <rect width="285.3333333333333" height="165" rx="14" fill="#f4f4f2" stroke="#d4d4d8" stroke-width="1.2"/>

    <g transform="translate(20, 26)">
      <circle cx="0" cy="0" r="3.5" fill="#8b5cf6"/>
      <text x="10" y="3.5" class="stack">TYPESCRIPT · REACT</text>
    </g>

    <g transform="translate(20, 56)">
      <text x="0" y="0" class="rname">GlowUp</text>
      <text x="0" y="24" class="desc">Gamified habit consistency tracker</text>
      <text x="0" y="42" class="desc">built for CSI Hackathon prototype.</text>
    </g>

    <g transform="translate(20, 140)">
      <text x="0" y="0" font-family="'SF Mono', Monaco, 'Courier New', Courier, monospace" font-size="9.5" font-weight="700" fill="#27272a">View Repository</text>
      <text x="237.33333333333331" y="0" class="arrow n">→</text>
    </g>
  </g>
</svg>