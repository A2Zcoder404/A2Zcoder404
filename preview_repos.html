<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya Nair — Featured Repositories (Avi Vashishta Design)</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .badge {
      background: #2f55ff;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      margin-left: 8px;
    }
    .section-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      text-align: left;
      font-family: monospace;
    }
    .preview-container {
      max-width: 880px;
      width: 100%;
    }
    .repo-row {
      display: flex;
      width: 100%;
      gap: 0;
      align-items: stretch;
    }
    .repo-row a {
      flex: 1;
      display: block;
      text-decoration: none;
    }
    .repo-row img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Featured Repositories <span class="badge">Avi Vashishta Architecture</span></h1>

  <div class="preview-container">
    <div class="section-title">GITHUB README ROW (3-COLUMN ROW — 880px WIDTH):</div>
    <div class="repo-row">
      <a href="https://github.com/Pixel-Nova-v1-1/NOVATRACE" target="_blank"><img src="./cards/repo-novatrace.svg" alt="NOVATRACE" /></a>
      <a href="https://github.com/Pixel-Nova-v1-1/AmoghaFoundation" target="_blank"><img src="./cards/repo-amogha.svg" alt="AmoghaFoundation" /></a>
      <a href="https://github.com/Pixel-Nova-v1-1/ZeStay" target="_blank"><img src="./cards/repo-zestay.svg" alt="ZeStay" /></a>
    </div>
  </div>

  <div class="preview-container" style="background:#ffffff; padding:24px; border-radius:16px;">
    <div class="section-title" style="color:#52525b;">LIGHT MODE GITHUB CANVAS PREVIEW:</div>
    <div class="repo-row">
      <a href="https://github.com/Pixel-Nova-v1-1/NOVATRACE" target="_blank"><img src="./cards/repo-novatrace.svg" alt="NOVATRACE" /></a>
      <a href="https://github.com/Pixel-Nova-v1-1/AmoghaFoundation" target="_blank"><img src="./cards/repo-amogha.svg" alt="AmoghaFoundation" /></a>
      <a href="https://github.com/Pixel-Nova-v1-1/ZeStay" target="_blank"><img src="./cards/repo-zestay.svg" alt="ZeStay" /></a>
    </div>
  </div>
</body>
</html>
