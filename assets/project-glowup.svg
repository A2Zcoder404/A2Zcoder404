<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img">
  <title>GlowUp — Gamified Wellness &amp; Habit Tracker</title>
  <desc>Gamified habit engine with streaks, badge progression, XP points, and daily quotes built for CSI Hackathon.</desc>
  <defs>
    <filter id="glowCardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="xpGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.5; }
    .tag-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 4px; }
    .tag-text { font-family: 'SF Mono', Monaco, monospace; font-size: 9.5px; fill: #c084fc; }
  </style>

  <!-- Card Background -->
  <rect width="520" height="320" rx="14" fill="#0c0a17" stroke="#3b0764" stroke-width="1.2" filter="url(#glowCardGlow)"/>

  <!-- Top Category Bar -->
  <g transform="translate(26, 26)">
    <rect width="135" height="20" rx="4" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
    <text x="67" y="14" class="mono" font-size="9" font-weight="700" fill="#c084fc" text-anchor="middle">HACKATHON BUILD</text>

    <!-- Hackathon badge -->
    <g transform="translate(400, 10)">
      <circle cx="0" cy="0" r="3.5" fill="#f59e0b"/>
      <text x="8" y="3" class="mono" font-size="9.5" fill="#f59e0b">CSI HACKATHON</text>
    </g>
  </g>

  <!-- Title & Description -->
  <g transform="translate(26, 68)">
    <text x="0" y="0" class="card-title">GLOWUP — GAMIFIED HABIT ENGINE</text>
    <text x="0" y="20" class="card-desc">Wellness and habit consistency engine driven by game mechanics.</text>
    <text x="0" y="36" class="card-desc">Engineered with XP leveling, milestone badges, and persistent streaks.</text>
  </g>

  <!-- Technical Illustration: XP Momentum Vector + Gamification Badges -->
  <g transform="translate(260, 195)">
    <!-- Grid Base -->
    <line x1="-180" y1="35" x2="180" y2="35" stroke="#2e1065" stroke-width="1"/>
    <line x1="-180" y1="-5" x2="180" y2="-5" stroke="#1f1035" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="-180" y1="-45" x2="180" y2="-45" stroke="#1f1035" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Upward Momentum XP Trajectory -->
    <path d="M-170 30 C-110 25, -70 5, -20 -15 C20 -30, 80 -40, 150 -55" fill="none" stroke="url(#xpGrad)" stroke-width="2.5"/>
    <!-- Area under curve fill -->
    <path d="M-170 30 C-110 25, -70 5, -20 -15 C20 -30, 80 -40, 150 -55 L150 35 L-170 35 Z" fill="#7e22ce" fill-opacity="0.12"/>

    <!-- XP Level Nodes along curve -->
    <circle cx="-110" cy="25" r="4.5" fill="#a855f7"/>
    <circle cx="-20" cy="-15" r="5" fill="#c084fc"/>
    <circle cx="80" cy="-40" r="6" fill="#f43f5e"/>
    
    <!-- Milestone 1: Flame Badge (Streak Champion) -->
    <g transform="translate(-140, -35)">
      <rect width="64" height="26" rx="4" fill="#1e1035" stroke="#6b21a8" stroke-width="1"/>
      <path d="M12 8 C12 8 15 13 15 16 C15 18 13.5 19.5 12 19.5 C10.5 19.5 9 18 9 16 C9 14.5 10 13 12 8 Z" fill="#f59e0b"/>
      <text x="22" y="17" class="mono" font-size="8.5" fill="#f59e0b">7D STREAK</text>
    </g>

    <!-- Milestone 2: Trophy Badge (Level 5) -->
    <g transform="translate(100, -75)">
      <rect width="70" height="26" rx="4" fill="#1e1035" stroke="#e11d48" stroke-width="1"/>
      <circle cx="12" cy="13" r="5" fill="#f43f5e"/>
      <text x="24" y="17" class="mono" font-size="8.5" fill="#fb7185">+500 XP</text>
    </g>

    <!-- XP Progress Bar Component -->
    <g transform="translate(-100, 15)">
      <rect width="200" height="10" rx="5" fill="#1e1035" stroke="#4c1d95" stroke-width="1"/>
      <rect width="145" height="10" rx="5" fill="url(#xpGrad)"/>
      <text x="100" y="8" class="mono" font-size="7" fill="#ffffff" text-anchor="middle">LEVEL 8 · 72% TO NEXT RANK</text>
    </g>
  </g>

  <!-- Bottom Technology Tags -->
  <g transform="translate(26, 275)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="90" height="24" class="tag-box"/>
    <text x="45" y="16" class="tag-text" text-anchor="middle">TypeScript</text>

    <!-- Tag 2 -->
    <rect x="98" y="0" width="75" height="24" class="tag-box"/>
    <text x="135" y="16" class="tag-text" fill="#61dafb" text-anchor="middle">React.js</text>

    <!-- Tag 3 -->
    <rect x="181" y="0" width="85" height="24" class="tag-box"/>
    <text x="223" y="16" class="tag-text" text-anchor="middle">Game Engine</text>

    <!-- Tag 4 -->
    <rect x="274" y="0" width="85" height="24" class="tag-box"/>
    <text x="316" y="16" class="tag-text" text-anchor="middle">CSS Modules</text>

    <!-- Link Icon -->
    <g transform="translate(450, 4)">
      <circle cx="8" cy="8" r="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M5 8 H11 M8 5 L11 8 L8 11" stroke="#a855f7" stroke-width="1.5" fill="none"/>
    </g>
  </g>
</svg>
