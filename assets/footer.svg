<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" role="img">
  <title>Aditya Mohan Nair — Closing Statement &amp; Network</title>
  <desc>Minimalist closing banner with verified social channels, blog, and collaborative invitation.</desc>
  <defs>
    <linearGradient id="footerLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="75%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .footer-pill { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8px; }
  </style>

  <!-- Frame Background -->
  <rect width="1000" height="200" rx="14" fill="#090d13" stroke="#1f2937" stroke-width="1.2"/>

  <!-- Top Accent Divider -->
  <rect x="60" y="0" width="880" height="1.5" fill="url(#footerLineGrad)"/>

  <!-- Closing Headline -->
  <g transform="translate(500, 48)">
    <text x="0" y="0" class="sans" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle" letter-spacing="0.5px">LET'S CONNECT AND BUILD SOMETHING EXTRAORDINARY</text>
    <text x="0" y="20" class="sans" font-size="11.5" fill="#8b949e" text-anchor="middle">Open to engineering collaborations, intelligent agent experiments, and creative software design.</text>
  </g>

  <!-- Social Link Interactive Badges -->
  <g transform="translate(180, 95)">
    <!-- GitHub Badge -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" class="footer-pill"/>
      <!-- Octocat circle icon -->
      <circle cx="24" cy="21" r="10" fill="#30363d"/>
      <circle cx="21" cy="18" r="1.5" fill="#ffffff"/>
      <circle cx="27" cy="18" r="1.5" fill="#ffffff"/>
      <text x="44" y="20" class="sans" font-size="11" font-weight="600" fill="#f0f6fc">GitHub</text>
      <text x="44" y="32" class="mono" font-size="9" fill="#58a6ff">@A2ZCoder404</text>
    </g>

    <!-- Twitter / X Badge -->
    <g transform="translate(230, 0)">
      <rect width="180" height="42" class="footer-pill"/>
      <rect x="14" y="11" width="20" height="20" rx="4" fill="#1d9bf0" fill-opacity="0.2"/>
      <text x="24" y="25" class="mono" font-size="12" font-weight="bold" fill="#1d9bf0" text-anchor="middle">X</text>
      <text x="44" y="20" class="sans" font-size="11" font-weight="600" fill="#f0f6fc">Twitter / X</text>
      <text x="44" y="32" class="mono" font-size="9" fill="#38bdf8">@zcoder404</text>
    </g>

    <!-- Engineering Blog Badge -->
    <g transform="translate(460, 0)">
      <rect width="210" height="42" class="footer-pill"/>
      <rect x="14" y="11" width="20" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <!-- Globe icon -->
      <circle cx="24" cy="21" r="7" fill="none" stroke="#10b981" stroke-width="1.2"/>
      <line x1="17" y1="21" x2="31" y2="21" stroke="#10b981" stroke-width="1"/>
      <text x="44" y="20" class="sans" font-size="11" font-weight="600" fill="#f0f6fc">Engineering Blog</text>
      <text x="44" y="32" class="mono" font-size="8.5" fill="#34d399">striveforexcellence.in</text>
    </g>
  </g>

  <!-- Bottom Technical Attribution -->
  <g transform="translate(500, 172)">
    <text x="0" y="0" class="mono" font-size="9" fill="#484f58" text-anchor="middle">CRAFTED WITH PRECISION &amp; SVG ARCHITECTURE · ADITYA MOHAN NAIR · 2026</text>
  </g>
</svg>
