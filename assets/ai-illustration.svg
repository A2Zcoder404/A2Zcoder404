<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" role="img">
  <title>Aditya Mohan Nair — Autonomous Agents &amp; Neural Computing</title>
  <desc>Abstract computational graph and neural network architecture representing artificial intelligence research and intelligent agents.</desc>
  <defs>
    <linearGradient id="netGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="nodeGlowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridSubtle" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161b22" stroke-width="0.75"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes flowDashes {
      to { stroke-dashoffset: -40; }
    }
    .flow-line { stroke-dasharray: 4 6; animation: flowDashes 2.5s linear infinite; }
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="800" height="380" rx="14" fill="#080c14" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="800" height="380" rx="14" fill="url(#gridSubtle)"/>

  <!-- Technical Header -->
  <g transform="translate(32, 34)">
    <circle cx="0" cy="0" r="3.5" fill="#3b82f6"/>
    <text x="12" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">INTELLIGENT SYSTEMS · NEURAL COMPUTE MODEL</text>
    <text x="736" y="4" class="mono" font-size="10" fill="#38bdf8" text-anchor="end">TOPOLOGY: MULTI-STAGE REASONING</text>
  </g>

  <!-- ================= NEURAL GRAPH ================= -->
  <!-- Layer 1: Inputs (x = 130) -->
  <!-- Layer 2: Feature Extraction (x = 300) -->
  <!-- Layer 3: Latent Representation & Decision (x = 490) -->
  <!-- Layer 4: Output Actions (x = 670) -->

  <!-- Interconnecting Synapses / Tensor Flow Lines -->
  <g stroke-width="1">
    <!-- L1 to L2 connections -->
    <path d="M130 90 L300 70" stroke="#334155" stroke-opacity="0.4"/>
    <path d="M130 90 L300 135" stroke="#334155" stroke-opacity="0.3"/>
    <path d="M130 90 L300 200" stroke="#38bdf8" stroke-opacity="0.6" class="flow-line"/>
    <path d="M130 155 L300 70" stroke="#334155" stroke-opacity="0.3"/>
    <path d="M130 155 L300 135" stroke="#38bdf8" stroke-opacity="0.7"/>
    <path d="M130 155 L300 200" stroke="#334155" stroke-opacity="0.4"/>
    <path d="M130 155 L300 265" stroke="#334155" stroke-opacity="0.3"/>
    <path d="M130 220 L300 135" stroke="#334155" stroke-opacity="0.3"/>
    <path d="M130 220 L300 200" stroke="#818cf8" stroke-opacity="0.6" class="flow-line"/>
    <path d="M130 220 L300 265" stroke="#334155" stroke-opacity="0.5"/>
    <path d="M130 285 L300 200" stroke="#334155" stroke-opacity="0.4"/>
    <path d="M130 285 L300 265" stroke="#38bdf8" stroke-opacity="0.6"/>

    <!-- L2 to L3 connections -->
    <path d="M300 70 L490 100" stroke="#3b82f6" stroke-opacity="0.6"/>
    <path d="M300 70 L490 170" stroke="#334155" stroke-opacity="0.4"/>
    <path d="M300 135 L490 100" stroke="#8b5cf6" stroke-opacity="0.7" class="flow-line"/>
    <path d="M300 135 L490 170" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <path d="M300 135 L490 240" stroke="#334155" stroke-opacity="0.3"/>
    <path d="M300 200 L490 100" stroke="#334155" stroke-opacity="0.3"/>
    <path d="M300 200 L490 170" stroke="#a855f7" stroke-opacity="0.8" class="flow-line"/>
    <path d="M300 200 L490 240" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <path d="M300 265 L490 170" stroke="#334155" stroke-opacity="0.4"/>
    <path d="M300 265 L490 240" stroke="#6366f1" stroke-opacity="0.7"/>

    <!-- L3 to L4 connections -->
    <path d="M490 100 L670 135" stroke="#10b981" stroke-opacity="0.7" class="flow-line"/>
    <path d="M490 100 L670 215" stroke="#334155" stroke-opacity="0.3"/>
    <path d="M490 170 L670 135" stroke="#10b981" stroke-opacity="0.8"/>
    <path d="M490 170 L670 215" stroke="#10b981" stroke-opacity="0.8" class="flow-line"/>
    <path d="M490 240 L670 135" stroke="#334155" stroke-opacity="0.4"/>
    <path d="M490 240 L670 215" stroke="#10b981" stroke-opacity="0.7"/>
  </g>

  <!-- ================= NODES ================= -->

  <!-- Layer 1 Nodes (Input: Sensory, Data, Vision) -->
  <g>
    <!-- Node 1 -->
    <circle cx="130" cy="90" r="16" fill="url(#nodeGlowBlue)" opacity="0.3"/>
    <circle cx="130" cy="90" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="130" cy="90" r="3" fill="#38bdf8"/>
    <text x="110" y="94" class="mono" font-size="9" fill="#94a3b8" text-anchor="end">IN:VISION</text>

    <!-- Node 2 -->
    <circle cx="130" cy="155" r="16" fill="url(#nodeGlowBlue)" opacity="0.3"/>
    <circle cx="130" cy="155" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="130" cy="155" r="3" fill="#38bdf8"/>
    <text x="110" y="159" class="mono" font-size="9" fill="#94a3b8" text-anchor="end">IN:STREAM</text>

    <!-- Node 3 -->
    <circle cx="130" cy="220" r="16" fill="url(#nodeGlowBlue)" opacity="0.3"/>
    <circle cx="130" cy="220" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="130" cy="220" r="3" fill="#38bdf8"/>
    <text x="110" y="224" class="mono" font-size="9" fill="#94a3b8" text-anchor="end">IN:CONTEXT</text>

    <!-- Node 4 -->
    <circle cx="130" cy="285" r="16" fill="url(#nodeGlowBlue)" opacity="0.3"/>
    <circle cx="130" cy="285" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="130" cy="285" r="3" fill="#38bdf8"/>
    <text x="110" y="289" class="mono" font-size="9" fill="#94a3b8" text-anchor="end">IN:STATE</text>
  </g>

  <!-- Layer 2 Nodes (Hidden: Feature Representations) -->
  <g>
    <circle cx="300" cy="70" r="9" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <circle cx="300" cy="70" r="3.5" fill="#a5b4fc"/>

    <circle cx="300" cy="135" r="22" fill="url(#nodeGlowViolet)" opacity="0.4"/>
    <circle cx="300" cy="135" r="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <circle cx="300" cy="135" r="4" fill="#c084fc"/>

    <circle cx="300" cy="200" r="22" fill="url(#nodeGlowViolet)" opacity="0.4"/>
    <circle cx="300" cy="200" r="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <circle cx="300" cy="200" r="4" fill="#c084fc"/>

    <circle cx="300" cy="265" r="9" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <circle cx="300" cy="265" r="3.5" fill="#a5b4fc"/>
  </g>

  <!-- Layer 3 Nodes (Latent / Agent Decision Core) -->
  <g>
    <circle cx="490" cy="100" r="11" fill="#18181b" stroke="#c084fc" stroke-width="2"/>
    <circle cx="490" cy="100" r="4" fill="#e9d5ff"/>

    <!-- Central Agent Core -->
    <circle cx="490" cy="170" r="32" fill="url(#nodeGlowViolet)" opacity="0.5"/>
    <circle cx="490" cy="170" r="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5"/>
    <circle cx="490" cy="170" r="6" fill="#38bdf8"/>
    <text x="490" y="196" class="mono" font-size="9" fill="#a855f7" text-anchor="middle">REASONING CORE</text>

    <circle cx="490" cy="240" r="11" fill="#18181b" stroke="#c084fc" stroke-width="2"/>
    <circle cx="490" cy="240" r="4" fill="#e9d5ff"/>
  </g>

  <!-- Layer 4 Nodes (Action / Output) -->
  <g>
    <!-- Output 1 -->
    <circle cx="670" cy="135" r="25" fill="url(#nodeGlowGreen)" opacity="0.4"/>
    <circle cx="670" cy="135" r="11" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="670" cy="135" r="4" fill="#34d399"/>
    <text x="692" y="139" class="mono" font-size="10" font-weight="700" fill="#34d399">ACT:GESTURE_DISPATCH</text>

    <!-- Output 2 -->
    <circle cx="670" cy="215" r="25" fill="url(#nodeGlowGreen)" opacity="0.4"/>
    <circle cx="670" cy="215" r="11" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="670" cy="215" r="4" fill="#34d399"/>
    <text x="692" y="219" class="mono" font-size="10" font-weight="700" fill="#34d399">ACT:AUTONOMOUS_POLICY</text>
  </g>

  <!-- Bottom Technical Legend -->
  <g transform="translate(32, 335)">
    <rect width="736" height="30" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1"/>
    <g transform="translate(16, 18)">
      <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
      <text x="8" y="3" class="mono" font-size="9" fill="#94a3b8">LAYER 1: INPUT SENSORS</text>
      
      <circle cx="170" cy="0" r="3" fill="#a855f7"/>
      <text x="178" y="3" class="mono" font-size="9" fill="#94a3b8">LAYER 2: ATTENTION &amp; EMBEDDINGS</text>
      
      <circle cx="380" cy="0" r="3" fill="#c084fc"/>
      <text x="388" y="3" class="mono" font-size="9" fill="#94a3b8">LAYER 3: LATENT REASONING</text>
      
      <circle cx="560" cy="0" r="3" fill="#10b981"/>
      <text x="568" y="3" class="mono" font-size="9" fill="#34d399">LAYER 4: DETERMINISTIC ACTIONS</text>
    </g>
  </g>
</svg>
