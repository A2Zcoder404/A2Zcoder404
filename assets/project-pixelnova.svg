<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img">
  <title>Pixel Nova — Creative Engineering Collective</title>
  <desc>Engineering collective identity dedicated to high-craft software engineering, intelligent agents, and innovative digital products.</desc>
  <defs>
    <filter id="pixelCardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="novaStarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.5; }
    .tag-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 4px; }
    .tag-text { font-family: 'SF Mono', Monaco, monospace; font-size: 9.5px; fill: #818cf8; }
  </style>

  <rect width="520" height="320" rx="14" fill="#0d0f19" stroke="#312e81" stroke-width="1.2" filter="url(#pixelCardGlow)"/>

  <!-- Top Category Bar -->
  <g transform="translate(26, 26)">
    <rect width="145" height="20" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="72" y="14" class="mono" font-size="9" font-weight="700" fill="#a5b4fc" text-anchor="middle">ENGINEERING TEAM</text>

    <!-- Collective state -->
    <g transform="translate(420, 10)">
      <circle cx="0" cy="0" r="3.5" fill="#818cf8"/>
      <text x="8" y="3" class="mono" font-size="9.5" fill="#a5b4fc">PIXEL NOVA</text>
    </g>
  </g>

  <!-- Title & Description -->
  <g transform="translate(26, 68)">
    <text x="0" y="0" class="card-title">TEAM PIXEL NOVA — CREATIVE GUILD</text>
    <text x="0" y="20" class="card-desc">Multidisciplinary developer guild designing high-performance web products,</text>
    <text x="0" y="36" class="card-desc">hackathon prototypes, and human-first artificial intelligence solutions.</text>
  </g>

  <!-- Illustration: Geometric Nova Starburst & Interconnected Nodes -->
  <g transform="translate(260, 195)">
    <!-- Ambient Celestial Grid -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#312e81" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#4338ca" stroke-width="1"/>

    <!-- Geometric 8-Pointed Nova Star -->
    <g>
      <polygon points="0,-40 7,-14 30,-30 14,-7 40,0 14,7 30,30 7,14 0,40 -7,14 -30,30 -14,7 -40,0 -14,-7 -30,-30 -7,-14" fill="url(#novaStarGrad)"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>

    <!-- Satellite Nodes representing Collective Roles -->
    <g transform="translate(-135, -20)">
      <rect width="78" height="36" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
      <text x="39" y="16" class="mono" font-size="8" fill="#e0e7ff" text-anchor="middle">FULL-STACK</text>
      <text x="39" y="27" class="mono" font-size="7.5" fill="#818cf8" text-anchor="middle">ARCHITECTURE</text>
      <line x1="78" y1="18" x2="110" y2="18" stroke="#6366f1" stroke-width="1" stroke-dasharray="2 2"/>
    </g>

    <g transform="translate(60, -20)">
      <rect width="78" height="36" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
      <text x="39" y="16" class="mono" font-size="8" fill="#e0e7ff" text-anchor="middle">AI / ML</text>
      <text x="39" y="27" class="mono" font-size="7.5" fill="#c084fc" text-anchor="middle">RESEARCH</text>
      <line x1="-30" y1="18" x2="0" y2="18" stroke="#6366f1" stroke-width="1" stroke-dasharray="2 2"/>
    </g>
  </g>

  <!-- Bottom Technology Tags -->
  <g transform="translate(26, 275)">
    <rect x="0" y="0" width="85" height="24" class="tag-box"/>
    <text x="42" y="16" class="tag-text" text-anchor="middle">Full-Stack</text>

    <rect x="93" y="0" width="85" height="24" class="tag-box"/>
    <text x="135" y="16" class="tag-text" text-anchor="middle">AI Agents</text>

    <rect x="186" y="0" width="85" height="24" class="tag-box"/>
    <text x="228" y="16" class="tag-text" text-anchor="middle">UI/UX Craft</text>

    <rect x="279" y="0" width="85" height="24" class="tag-box"/>
    <text x="321" y="16" class="tag-text" text-anchor="middle">Hackathons</text>

    <g transform="translate(450, 4)">
      <circle cx="8" cy="8" r="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M5 8 H11 M8 5 L11 8 L8 11" stroke="#818cf8" stroke-width="1.5" fill="none"/>
    </g>
  </g>
</svg>
