<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img">
  <title>Medicine Reminder App — Desktop Health Scheduler</title>
  <desc>Python desktop application with SQLite database, family user profiles, and cross-platform dosage notifications.</desc>
  <defs>
    <filter id="medCardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.5; }
    .tag-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 4px; }
    .tag-text { font-family: 'SF Mono', Monaco, monospace; font-size: 9.5px; fill: #fbbf24; }
  </style>

  <!-- Card Background -->
  <rect width="520" height="320" rx="14" fill="#0d0f14" stroke="#78350f" stroke-width="1.2" filter="url(#medCardGlow)"/>

  <!-- Top Category Bar -->
  <g transform="translate(26, 26)">
    <rect width="138" height="20" rx="4" fill="#451a03" stroke="#b45309" stroke-width="1"/>
    <text x="69" y="14" class="mono" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">DESKTOP &amp; SQLITE</text>

    <!-- Version tag -->
    <g transform="translate(425, 10)">
      <circle cx="0" cy="0" r="3.5" fill="#f59e0b"/>
      <text x="8" y="3" class="mono" font-size="9.5" fill="#f59e0b">PYTHON 3</text>
    </g>
  </g>

  <!-- Title & Description -->
  <g transform="translate(26, 68)">
    <text x="0" y="0" class="card-title">MEDICINE REMINDER — CLINICAL TRACKER</text>
    <text x="0" y="20" class="card-desc">Desktop healthcare scheduler engineered with Python, Tkinter, and SQLite.</text>
    <text x="0" y="36" class="card-desc">Features multi-user family profiles, notifications, and adherence logs.</text>
  </g>

  <!-- Technical Illustration: Medicine Capsule + Dosage Schedule Matrix -->
  <g transform="translate(260, 195)">
    <!-- Medicine Capsule graphic -->
    <g transform="translate(-130, -35) rotate(-35)">
      <!-- Left half of capsule (solid amber) -->
      <path d="M-30 -12 C-40 -12 -45 -5 -45 0 C-45 5 -40 12 -30 12 L-5 12 L-5 -12 Z" fill="#f59e0b"/>
      <!-- Right half of capsule (outline/glass blue) -->
      <path d="M-5 -12 L20 -12 C30 -12 35 -5 35 0 C35 5 30 12 20 12 L-5 12 Z" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="-5" y1="-12" x2="-5" y2="12" stroke="#ffffff" stroke-width="1.2"/>
    </g>

    <!-- Database Cylinder (SQLite) -->
    <g transform="translate(0, -25)">
      <ellipse cx="0" cy="-15" rx="26" ry="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M-26 -15 v14 c0 4.4 11.6 8 26 8 s26 -3.6 26 -8 v-14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M-26 -1 v14 c0 4.4 11.6 8 26 8 s26 -3.6 26 -8 v-14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="5" class="mono" font-size="8.5" fill="#38bdf8" text-anchor="middle">SQLITE DB</text>
    </g>

    <!-- Notification Bell & Timeline (Right Side) -->
    <g transform="translate(110, -25)">
      <!-- Bell icon -->
      <path d="M10 -15 C6 -15 2 -10 2 0 L-2 8 H22 L18 0 C18 -10 14 -15 10 -15 Z" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="10" cy="12" r="2.5" fill="#f59e0b"/>
      
      <!-- Timeline events -->
      <text x="32" y="-5" class="mono" font-size="8" fill="#e2e8f0">08:00 AM · MORNING</text>
      <text x="32" y="8" class="mono" font-size="8" fill="#10b981">14:00 PM · TAKEN ✓</text>
      <text x="32" y="21" class="mono" font-size="8" fill="#f59e0b">20:00 PM · PENDING</text>
    </g>

    <!-- Timeline Wire Connector -->
    <path d="M-80 -10 L-30 -10 M30 -10 L95 -10" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- Bottom Technology Tags -->
  <g transform="translate(26, 275)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="75" height="24" class="tag-box"/>
    <text x="37" y="16" class="tag-text" text-anchor="middle">Python 3</text>

    <!-- Tag 2 -->
    <rect x="83" y="0" width="85" height="24" class="tag-box"/>
    <text x="125" y="16" class="tag-text" fill="#38bdf8" text-anchor="middle">SQLite RDBMS</text>

    <!-- Tag 3 -->
    <rect x="176" y="0" width="85" height="24" class="tag-box"/>
    <text x="218" y="16" class="tag-text" text-anchor="middle">Tkinter GUI</text>

    <!-- Tag 4 -->
    <rect x="269" y="0" width="95" height="24" class="tag-box"/>
    <text x="316" y="16" class="tag-text" text-anchor="middle">Plyer Notifications</text>

    <!-- Link Icon -->
    <g transform="translate(450, 4)">
      <circle cx="8" cy="8" r="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M5 8 H11 M8 5 L11 8 L8 11" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    </g>
  </g>
</svg>
