<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" role="img">
  <title>Aditya Mohan Nair — End-to-End System Architecture</title>
  <desc>System architecture diagram illustrating the interactive client layer, API gateway, intelligent AI services, persistence layer, and CI/CD pipelines.</desc>
  <defs>
    <pattern id="archGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#161b22" stroke-width="0.8"/>
    </pattern>

    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrowheadViolet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a855f7"/>
    </marker>

    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <style>
    .title-sec { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #8b949e; text-transform: uppercase; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f0f6fc; }
    .box-sub { font-family: 'SF Mono', Monaco, 'Courier New', monospace; font-size: 10px; fill: #8b949e; }
    .wire { stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .wire-solid { stroke: #30363d; stroke-width: 1.5; fill: none; }
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="1000" height="480" rx="14" fill="#090d13" stroke="#21262d" stroke-width="1.2"/>
  <rect width="1000" height="480" rx="14" fill="url(#archGrid)"/>

  <!-- Top Header -->
  <g transform="translate(36, 36)">
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8"/>
    <text x="12" y="4" class="title-sec">END-TO-END SYSTEM ARCHITECTURE &amp; DATA PIPELINE</text>
    <line x1="390" y1="0" x2="928" y2="0" stroke="#21262d" stroke-width="1"/>
    <text x="928" y="4" class="mono" font-size="10" fill="#38bdf8" text-anchor="end">PIPELINE: DISTRIBUTED &amp; REACTIVE</text>
  </g>

  <!-- ================= TOP PILLARS: CI/CD & EDGE HOSTING ================= -->
  <g transform="translate(240, 68)">
    <!-- GitHub Actions -->
    <rect x="0" y="0" width="240" height="48" rx="8" fill="url(#boxGrad)" stroke="#30363d" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#238636" fill-opacity="0.2"/>
    <path d="M20 24 L23 27 L28 21" stroke="#3fb950" stroke-width="1.8" fill="none"/>
    <text x="44" y="21" class="box-title">GitHub Actions</text>
    <text x="44" y="34" class="box-sub">Automated CI/CD &amp; Testing</text>

    <!-- Connect line to Vercel -->
    <line x1="240" y1="24" x2="280" y2="24" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrowhead)"/>

    <!-- Vercel Edge -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="240" height="48" rx="8" fill="url(#boxGrad)" stroke="#30363d" stroke-width="1"/>
      <polygon points="24,16 31,28 17,28" fill="#ffffff"/>
      <text x="44" y="21" class="box-title">Vercel Edge Network</text>
      <text x="44" y="34" class="box-sub">Global CDN &amp; Serverless Host</text>
    </g>
  </g>

  <!-- ================= TIER 1: CLIENT FRONTEND (X = 36 to 260) ================= -->
  <g transform="translate(36, 140)">
    <rect width="234" height="260" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <text x="18" y="28" class="title-sec">CLIENT LAYER</text>

    <!-- React App Box -->
    <g transform="translate(16, 42)">
      <rect width="202" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="20" cy="30" r="10" fill="#61dafb" fill-opacity="0.15" stroke="#61dafb" stroke-width="1.2"/>
      <circle cx="20" cy="30" r="3" fill="#61dafb"/>
      <text x="38" y="26" class="box-title">React &amp; TypeScript</text>
      <text x="38" y="42" class="box-sub">Reactive UI &amp; State Trees</text>
    </g>

    <!-- MediaPipe Vision Box -->
    <g transform="translate(16, 114)">
      <rect width="202" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="10" y="18" width="22" height="22" rx="4" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1"/>
      <path d="M16 32 L21 24 L26 32 Z" fill="#22d3ee"/>
      <text x="38" y="26" class="box-title">MediaPipe Vision</text>
      <text x="38" y="42" class="box-sub">Realtime Webcam Landmarks</text>
    </g>

    <!-- Tailwind & Canvas -->
    <g transform="translate(16, 186)">
      <rect width="202" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="20" cy="30" r="9" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="14" y="34" class="mono" font-size="10" font-weight="bold" fill="#06b6d4">CSS</text>
      <text x="38" y="26" class="box-title">Tailwind &amp; Canvas</text>
      <text x="38" y="42" class="box-sub">Hardware Accelerated HUD</text>
    </g>
  </g>

  <!-- ================= TIER 2: API & PROTOCOL GATEWAY (X = 350 to 570) ================= -->
  <g transform="translate(350, 140)">
    <rect width="234" height="260" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <text x="18" y="28" class="title-sec">SERVICE &amp; API GATEWAY</text>

    <!-- Node.js / Express Box -->
    <g transform="translate(16, 42)">
      <rect width="202" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="10" y="18" width="22" height="22" rx="4" fill="#339933" fill-opacity="0.2" stroke="#339933" stroke-width="1"/>
      <text x="13" y="33" class="mono" font-size="9" font-weight="bold" fill="#339933">JS</text>
      <text x="38" y="26" class="box-title">Node.js / Express API</text>
      <text x="38" y="42" class="box-sub">REST Endpoints &amp; Routes</text>
    </g>

    <!-- Auth & Security Gateway -->
    <g transform="translate(16, 114)">
      <rect width="202" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="20" cy="30" r="9" fill="#ffca28" fill-opacity="0.2"/>
      <path d="M16 28 L20 22 L24 28 Z" fill="#ffca28"/>
      <text x="38" y="26" class="box-title">Firebase Auth Token</text>
      <text x="38" y="42" class="box-sub">JWT Verification &amp; RBAC</text>
    </g>

    <!-- Python Desktop / Backend Process -->
    <g transform="translate(16, 186)">
      <rect width="202" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="10" y="18" width="22" height="22" rx="4" fill="#3776ab" fill-opacity="0.2" stroke="#3776ab" stroke-width="1"/>
      <text x="13" y="33" class="mono" font-size="9" font-weight="bold" fill="#ffd43b">PY</text>
      <text x="38" y="26" class="box-title">Python Core Workers</text>
      <text x="38" y="42" class="box-sub">Daemon Tasks &amp; Desktop GUI</text>
    </g>
  </g>

  <!-- ================= TIER 3: DATA & AI SERVICES (X = 664 to 964) ================= -->
  <g transform="translate(664, 140)">
    <rect width="300" height="260" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <text x="18" y="28" class="title-sec">DATA STORE &amp; AI COMPUTE</text>

    <!-- Firebase Firestore / RTDB -->
    <g transform="translate(16, 42)">
      <rect width="268" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <ellipse cx="24" cy="24" rx="10" ry="4" fill="none" stroke="#ffca28" stroke-width="1.2"/>
      <path d="M14 24 v10 c0 2.2 4.5 4 10 4 s10 -1.8 10 -4 v-10" fill="none" stroke="#ffca28" stroke-width="1.2"/>
      <text x="44" y="26" class="box-title">Cloud Firestore / Realtime DB</text>
      <text x="44" y="42" class="box-sub">Document Store · Live Sync</text>
    </g>

    <!-- SQLite Embedded DB -->
    <g transform="translate(16, 114)">
      <rect width="268" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <ellipse cx="24" cy="24" rx="10" ry="4" fill="none" stroke="#0284c7" stroke-width="1.2"/>
      <path d="M14 24 v10 c0 2.2 4.5 4 10 4 s10 -1.8 10 -4 v-10" fill="none" stroke="#0284c7" stroke-width="1.2"/>
      <text x="44" y="26" class="box-title">SQLite Local Relational DB</text>
      <text x="44" y="42" class="box-sub">ACID Transactions · Local Cache</text>
    </g>

    <!-- AI Inference / LLM Services -->
    <g transform="translate(16, 186)">
      <rect width="268" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="24" cy="30" r="10" fill="#8b5cf6" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.2"/>
      <circle cx="24" cy="30" r="3.5" fill="#c084fc"/>
      <text x="44" y="26" class="box-title">Google Gemini / AI Models</text>
      <text x="44" y="42" class="box-sub">Semantic Ingestion &amp; Classification</text>
    </g>
  </g>

  <!-- ================= INTER-TIER DATA PIPELINES ================= -->
  <!-- Client to API lines -->
  <g>
    <!-- React -> API -->
    <path d="M270 210 L350 210" class="wire" marker-end="url(#arrowhead)"/>
    <text x="310" y="202" class="mono" font-size="8" fill="#38bdf8" text-anchor="middle">HTTPS</text>

    <!-- API to Databases -->
    <path d="M584 210 L664 210" class="wire" marker-end="url(#arrowhead)"/>
    <text x="624" y="202" class="mono" font-size="8" fill="#38bdf8" text-anchor="middle">TCP/TLS</text>

    <!-- Gesture pipeline directly into Client HUD -->
    <path d="M250 284 L295 284 L295 235 L350 235" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Bottom Architecture Metrics -->
  <g transform="translate(36, 420)">
    <rect width="928" height="42" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <g transform="translate(24, 25)">
      <circle cx="0" cy="0" r="3" fill="#10b981"/>
      <text x="10" y="3" class="mono" font-size="10" fill="#e6edf3">SECURITY &amp; COMPLIANCE:</text>
      <text x="160" y="3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#8b949e">Zero-Trust Environment · Client-side Biometric Processing · Sandboxed Local Storage · TLS In-Transit</text>
      <text x="880" y="3" class="mono" font-size="10" fill="#10b981" text-anchor="end">SYS:OPTIMAL</text>
    </g>
  </g>
</svg>
