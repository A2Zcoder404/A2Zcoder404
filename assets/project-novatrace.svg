<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img">
  <title>NovaTrace — AI Email Threat Detection &amp; Forensics</title>
  <desc>Cybersecurity intelligence platform analyzing email headers, phishing vectors, and anomalous heuristic payloads.</desc>
  <defs>
    <filter id="novaCardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.5; }
    .tag-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 4px; }
    .tag-text { font-family: 'SF Mono', Monaco, monospace; font-size: 9.5px; fill: #f43f5e; }
  </style>

  <rect width="520" height="320" rx="14" fill="#0f0b12" stroke="#4c0519" stroke-width="1.2" filter="url(#novaCardGlow)"/>

  <!-- Top Category Bar -->
  <g transform="translate(26, 26)">
    <rect width="145" height="20" rx="4" fill="#4c0519" stroke="#9f1239" stroke-width="1"/>
    <text x="72" y="14" class="mono" font-size="9" font-weight="700" fill="#f43f5e" text-anchor="middle">CYBERSECURITY / AI</text>

    <!-- Shield status -->
    <g transform="translate(415, 10)">
      <circle cx="0" cy="0" r="3.5" fill="#f43f5e"/>
      <text x="8" y="3" class="mono" font-size="9.5" fill="#fb7185">ZERO-TRUST</text>
    </g>
  </g>

  <!-- Title & Description -->
  <g transform="translate(26, 68)">
    <text x="0" y="0" class="card-title">NOVATRACE — EMAIL THREAT DETECTOR</text>
    <text x="0" y="20" class="card-desc">AI-assisted email forensics engine classifying phishing vectors, spoofed</text>
    <text x="0" y="36" class="card-desc">DKIM/SPF headers, and anomalous domain heuristics in real-time.</text>
  </g>

  <!-- Illustration: Security Radar & Forensic Packet Analysis -->
  <g transform="translate(260, 195)">
    <!-- Radar scanner circles -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#4c0519" stroke-width="1"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#881337" stroke-width="1" stroke-dasharray="3 4"/>
    <circle cx="0" cy="0" r="16" fill="#1e101b" stroke="#e11d48" stroke-width="1.5"/>

    <!-- Shield icon in center -->
    <path d="M-9 -10 L0 -14 L9 -10 C9 0 0 10 0 10 C0 10 -9 0 -9 -10 Z" fill="#e11d48"/>

    <!-- Sweep line -->
    <line x1="0" y1="0" x2="42" y2="-28" stroke="#f43f5e" stroke-width="1.8"/>

    <!-- Threat Analysis Indicators (Left Side) -->
    <g transform="translate(-160, -35)">
      <text x="0" y="10" class="mono" font-size="8.5" fill="#fb7185">SPF: PASS (VERIFIED)</text>
      <text x="0" y="26" class="mono" font-size="8.5" fill="#f43f5e">DKIM: MISMATCH ⚠</text>
      <text x="0" y="42" class="mono" font-size="8.5" fill="#34d399">MALWARE HEURISTICS: 0.02</text>
    </g>

    <!-- Threat Matrix Breakdown (Right Side) -->
    <g transform="translate(85, -35)">
      <rect width="105" height="48" rx="4" fill="#1c0f18" stroke="#881337" stroke-width="1"/>
      <text x="10" y="16" class="mono" font-size="8" fill="#fda4af">RISK SCORE: 88%</text>
      <text x="10" y="30" class="mono" font-size="8" fill="#f43f5e">ACTION: QUARANTINE</text>
      <text x="10" y="42" class="mono" font-size="7.5" fill="#94a3b8">HASH: sha256:7b9c..</text>
    </g>
  </g>

  <!-- Bottom Technology Tags -->
  <g transform="translate(26, 275)">
    <rect x="0" y="0" width="75" height="24" class="tag-box"/>
    <text x="37" y="16" class="tag-text" text-anchor="middle">Python</text>

    <rect x="83" y="0" width="95" height="24" class="tag-box"/>
    <text x="130" y="16" class="tag-text" text-anchor="middle">NLP / Threat ML</text>

    <rect x="186" y="0" width="85" height="24" class="tag-box"/>
    <text x="228" y="16" class="tag-text" text-anchor="middle">Forensics</text>

    <rect x="279" y="0" width="95" height="24" class="tag-box"/>
    <text x="326" y="16" class="tag-text" text-anchor="middle">Header Parser</text>

    <g transform="translate(450, 4)">
      <circle cx="8" cy="8" r="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M5 8 H11 M8 5 L11 8 L8 11" stroke="#f43f5e" stroke-width="1.5" fill="none"/>
    </g>
  </g>
</svg>
