<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="100%" role="img">
  <title>Aditya Mohan Nair — Language Distribution</title>
  <desc>Verified programming language distribution by total byte count compiled across all public repositories.</desc>
  <defs>
    <filter id="langCardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="langBarClip">
      <rect x="0" y="0" width="472" height="12" rx="6" ry="6"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title-sec { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #c9d1d9; }
    .lang-label { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #f0f6fc; }
    .lang-pct { font-family: 'SF Mono', Monaco, monospace; font-size: 11px; font-weight: 600; fill: #8b949e; }
  </style>

  <!-- Container Box -->
  <rect width="520" height="250" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.2" filter="url(#langCardGlow)"/>

  <!-- Card Header -->
  <g transform="translate(24, 26)">
    <circle cx="0" cy="0" r="3.5" fill="#3178c6"/>
    <text x="12" y="4" class="title-sec">LANGUAGE DISTRIBUTION</text>
    <text x="472" y="4" class="mono" font-size="10" fill="#8b949e" text-anchor="end">576.5 KB INDEXED</text>
    <line x1="0" y1="16" x2="472" y2="16" stroke="#21262d" stroke-width="1"/>
  </g>

  <!-- Segmented Language Distribution Bar (width: 472) -->
  <!-- TS: 34.8% = 164px | HTML: 24.4% = 115px | JS: 15.1% = 71px | CSS: 13.5% = 64px | PY: 12.1% = 57px -->
  <g transform="translate(24, 66)">
    <g clip-path="url(#langBarClip)">
      <!-- TypeScript (34.8%) -->
      <rect x="0" y="0" width="164" height="12" fill="#3178c6"/>
      <!-- HTML (24.4%) -->
      <rect x="165" y="0" width="115" height="12" fill="#e34f26"/>
      <!-- JavaScript (15.1%) -->
      <rect x="281" y="0" width="71" height="12" fill="#f7df1e"/>
      <!-- CSS (13.5%) -->
      <rect x="353" y="0" width="63" height="12" fill="#1572b6"/>
      <!-- Python (12.1%) -->
      <rect x="417" y="0" width="55" height="12" fill="#3776ab"/>
    </g>
  </g>

  <!-- ================= LANGUAGE LEGEND ================= -->
  <!-- Row 1: TypeScript, HTML -->
  <g transform="translate(24, 105)">
    <!-- TypeScript -->
    <g transform="translate(10, 0)">
      <circle cx="0" cy="0" r="4.5" fill="#3178c6"/>
      <text x="12" y="4" class="lang-label">TypeScript</text>
      <text x="110" y="4" class="lang-pct">34.8%</text>
      <text x="165" y="4" class="mono" font-size="9" fill="#58a6ff">342.6 KB</text>
    </g>

    <!-- HTML -->
    <g transform="translate(260, 0)">
      <circle cx="0" cy="0" r="4.5" fill="#e34f26"/>
      <text x="12" y="4" class="lang-label">HTML / Web</text>
      <text x="110" y="4" class="lang-pct">24.4%</text>
      <text x="165" y="4" class="mono" font-size="9" fill="#8b949e">240.1 KB</text>
    </g>
  </g>

  <!-- Row 2: JavaScript, CSS -->
  <g transform="translate(24, 145)">
    <!-- JavaScript -->
    <g transform="translate(10, 0)">
      <circle cx="0" cy="0" r="4.5" fill="#f7df1e"/>
      <text x="12" y="4" class="lang-label">JavaScript</text>
      <text x="110" y="4" class="lang-pct">15.1%</text>
      <text x="165" y="4" class="mono" font-size="9" fill="#8b949e">148.5 KB</text>
    </g>

    <!-- CSS -->
    <g transform="translate(260, 0)">
      <circle cx="0" cy="0" r="4.5" fill="#1572b6"/>
      <text x="12" y="4" class="lang-label">CSS / Styling</text>
      <text x="110" y="4" class="lang-pct">13.5%</text>
      <text x="165" y="4" class="mono" font-size="9" fill="#8b949e">133.1 KB</text>
    </g>
  </g>

  <!-- Row 3: Python, Low-Level Systems -->
  <g transform="translate(24, 185)">
    <!-- Python -->
    <g transform="translate(10, 0)">
      <circle cx="0" cy="0" r="4.5" fill="#3776ab"/>
      <text x="12" y="4" class="lang-label">Python</text>
      <text x="110" y="4" class="lang-pct">12.1%</text>
      <text x="165" y="4" class="mono" font-size="9" fill="#8b949e">119.5 KB</text>
    </g>

    <!-- C / C++ / Systems -->
    <g transform="translate(260, 0)">
      <circle cx="0" cy="0" r="4.5" fill="#00599c"/>
      <text x="12" y="4" class="lang-label">C / C++ &amp; Java</text>
      <text x="110" y="4" class="lang-pct">&lt;1.0%</text>
      <text x="165" y="4" class="mono" font-size="9" fill="#8b949e">Algorithms</text>
    </g>
  </g>

  <!-- Bottom verification note -->
  <g transform="translate(24, 228)">
    <text x="0" y="0" class="mono" font-size="8.5" fill="#484f58">SOURCE: GITHUB REPOSITORIES REST API · REAL-TIME COMPILATION</text>
    <text x="472" y="0" class="mono" font-size="8.5" fill="#238636" text-anchor="end">● VERIFIED LIVE</text>
  </g>
</svg>
