<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img">
  <title>Iron Eight — Gesture-Controlled Arc Reactor HUD</title>
  <desc>Iron Man inspired Arc Reactor dashboard featuring MediaPipe hand gesture tracking and dynamic subsystem energy routing.</desc>
  <defs>
    <filter id="hudCardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#0891b2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.5; }
    .tag-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 4px; }
    .tag-text { font-family: 'SF Mono', Monaco, monospace; font-size: 9.5px; fill: #38bdf8; }
  </style>

  <!-- Card Background -->
  <rect width="520" height="320" rx="14" fill="#090d14" stroke="#1e293b" stroke-width="1.2" filter="url(#hudCardGlow)"/>

  <!-- Top Category Bar -->
  <g transform="translate(26, 26)">
    <rect width="112" height="20" rx="4" fill="#083344" stroke="#0e7490" stroke-width="1"/>
    <text x="56" y="14" class="mono" font-size="9" font-weight="700" fill="#22d3ee" text-anchor="middle">GESTURE HUD / AI</text>

    <!-- Live indicator -->
    <g transform="translate(425, 10)">
      <circle cx="0" cy="0" r="3.5" fill="#10b981"/>
      <text x="8" y="3" class="mono" font-size="9.5" fill="#34d399">LIVE DEMO</text>
    </g>
  </g>

  <!-- Title & Description -->
  <g transform="translate(26, 68)">
    <text x="0" y="0" class="card-title">IRON EIGHT — ARC REACTOR HUD</text>
    <text x="0" y="20" class="card-desc">Tony Stark-inspired cybernetic dashboard with real-time hand gesture</text>
    <text x="0" y="36" class="card-desc">control powered by MediaPipe. Manage subsystem energy via camera.</text>
  </g>

  <!-- Technical Illustration: Arc Reactor + Gesture Landmark Graphic -->
  <g transform="translate(260, 195)">
    <!-- Ambient Reactor Glow -->
    <circle cx="0" cy="0" r="60" fill="url(#reactorCore)" opacity="0.3"/>
    
    <!-- Outer Reactor Ring with ticks -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#1e293b" stroke-width="6"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="14 12" opacity="0.85"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 6"/>
    
    <!-- Inner Segments -->
    <circle cx="0" cy="0" r="32" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="18" fill="url(#reactorCore)"/>
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>

    <!-- Hand Gesture Tracking Lines Overlay (Left Side) -->
    <g transform="translate(-160, -35)">
      <!-- Hand Landmark Nodes -->
      <circle cx="20" cy="40" r="3" fill="#38bdf8"/>
      <circle cx="35" cy="25" r="3" fill="#22d3ee"/>
      <circle cx="50" cy="10" r="3" fill="#22d3ee"/> <!-- Index tip -->
      <circle cx="35" cy="45" r="3" fill="#38bdf8"/>
      <circle cx="45" cy="35" r="3" fill="#22d3ee"/> <!-- Thumb tip -->
      <circle cx="10" cy="55" r="3.5" fill="#0284c7"/> <!-- Wrist -->

      <!-- Skeletal tracking rays -->
      <line x1="10" y1="55" x2="20" y2="40" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
      <line x1="20" y1="40" x2="35" y2="25" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
      <line x1="35" y1="25" x2="50" y2="10" stroke="#22d3ee" stroke-width="1.5"/>
      <line x1="10" y1="55" x2="35" y2="45" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
      <line x1="35" y1="45" x2="45" y2="35" stroke="#22d3ee" stroke-width="1.5"/>
      <!-- Pinch gesture visual connector -->
      <line x1="50" y1="10" x2="45" y2="35" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2"/>

      <text x="0" y="70" class="mono" font-size="8.5" fill="#94a3b8">GESTURE: PINCH-TO-ROUT</text>
    </g>

    <!-- Subsystem Status Pills (Right Side) -->
    <g transform="translate(85, -45)">
      <text x="0" y="10" class="mono" font-size="9" fill="#38bdf8">PROPULSION: 85%</text>
      <text x="0" y="26" class="mono" font-size="9" fill="#22d3ee">DEFENSE: 92%</text>
      <text x="0" y="42" class="mono" font-size="9" fill="#34d399">AVIONICS: OPTIMAL</text>
    </g>
  </g>

  <!-- Bottom Technology Tags -->
  <g transform="translate(26, 275)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="88" height="24" class="tag-box"/>
    <text x="44" y="16" class="tag-text" text-anchor="middle">JavaScript</text>

    <!-- Tag 2 -->
    <rect x="96" y="0" width="115" height="24" class="tag-box"/>
    <text x="153" y="16" class="tag-text" fill="#22d3ee" text-anchor="middle">MediaPipe Hands</text>

    <!-- Tag 3 -->
    <rect x="219" y="0" width="75" height="24" class="tag-box"/>
    <text x="256" y="16" class="tag-text" text-anchor="middle">Vercel Edge</text>

    <!-- Tag 4 -->
    <rect x="302" y="0" width="80" height="24" class="tag-box"/>
    <text x="342" y="16" class="tag-text" text-anchor="middle">Webcam API</text>

    <!-- Link Icon / Arrow -->
    <g transform="translate(450, 4)">
      <circle cx="8" cy="8" r="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M5 8 H11 M8 5 L11 8 L8 11" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    </g>
  </g>
</svg>
