<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img">
  <title>MindCare — Mental Health Web Application</title>
  <desc>Full-stack mental health platform connecting users with therapists, interactive clinical assessments, and secure Firebase authentication.</desc>
  <defs>
    <filter id="mindCardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="mindGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.5; }
    .tag-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 4px; }
    .tag-text { font-family: 'SF Mono', Monaco, monospace; font-size: 9.5px; fill: #34d399; }
  </style>

  <!-- Card Background -->
  <rect width="520" height="320" rx="14" fill="#080f14" stroke="#134e4a" stroke-width="1.2" filter="url(#mindCardGlow)"/>

  <!-- Top Category Bar -->
  <g transform="translate(26, 26)">
    <rect width="130" height="20" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="65" y="14" class="mono" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">FULL-STACK HEALTH</text>

    <!-- Category tag -->
    <g transform="translate(435, 10)">
      <circle cx="0" cy="0" r="3.5" fill="#10b981"/>
      <text x="8" y="3" class="mono" font-size="9.5" fill="#10b981">ALPHA</text>
    </g>
  </g>

  <!-- Title & Description -->
  <g transform="translate(26, 68)">
    <text x="0" y="0" class="card-title">MINDCARE — MENTAL HEALTH PLATFORM</text>
    <text x="0" y="20" class="card-desc">Comprehensive web application connecting users with qualified therapists.</text>
    <text x="0" y="36" class="card-desc">Features clinical self-assessments, Firebase Auth, and secure onboarding.</text>
  </g>

  <!-- Technical Illustration: Brain Synapse / Care Waveform Graphic -->
  <g transform="translate(260, 195)">
    <!-- Shield / Safe Space Container -->
    <path d="M-60 -45 L0 -65 L60 -45 C60 10 0 55 0 55 C0 55 -60 10 -60 -45 Z" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>

    <!-- Synapse Network Nodes (Representing Mental Clarity & Wellness) -->
    <!-- Center Node -->
    <circle cx="0" cy="-8" r="7" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="2"/>
    <circle cx="0" cy="-8" r="3" fill="#ffffff"/>

    <!-- Left Hemisphere Nodes -->
    <circle cx="-28" cy="-25" r="4.5" fill="#047857"/>
    <circle cx="-38" cy="0" r="4" fill="#059669"/>
    <circle cx="-20" cy="18" r="4.5" fill="#10b981"/>

    <!-- Right Hemisphere Nodes -->
    <circle cx="28" cy="-25" r="4.5" fill="#047857"/>
    <circle cx="38" cy="0" r="4" fill="#059669"/>
    <circle cx="20" cy="18" r="4.5" fill="#10b981"/>

    <!-- Connecting neural pathways -->
    <line x1="0" y1="-8" x2="-28" y2="-25" stroke="#34d399" stroke-width="1.2" opacity="0.8"/>
    <line x1="0" y1="-8" x2="-38" y2="0" stroke="#34d399" stroke-width="1.2" opacity="0.8"/>
    <line x1="0" y1="-8" x2="-20" y2="18" stroke="#34d399" stroke-width="1.2" opacity="0.8"/>
    <line x1="0" y1="-8" x2="28" y2="-25" stroke="#34d399" stroke-width="1.2" opacity="0.8"/>
    <line x1="0" y1="-8" x2="38" y2="0" stroke="#34d399" stroke-width="1.2" opacity="0.8"/>
    <line x1="0" y1="-8" x2="20" y2="18" stroke="#34d399" stroke-width="1.2" opacity="0.8"/>

    <!-- ECG Wellness Pulse Line (Left & Right Wings) -->
    <path d="M-190 -8 L-130 -8 L-115 -25 L-100 12 L-85 -18 L-70 -8 L-60 -8" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="-190" y="16" class="mono" font-size="8.5" fill="#34d399">ASSESSMENT ENGINE</text>

    <path d="M60 -8 L70 -8 L85 -22 L100 14 L115 -14 L130 -8 L190 -8" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="190" y="16" class="mono" font-size="8.5" fill="#34d399" text-anchor="end">THERAPIST MATCHING</text>
  </g>

  <!-- Bottom Technology Tags -->
  <g transform="translate(26, 275)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="88" height="24" class="tag-box"/>
    <text x="44" y="16" class="tag-text" text-anchor="middle">JavaScript</text>

    <!-- Tag 2 -->
    <rect x="96" y="0" width="105" height="24" class="tag-box"/>
    <text x="148" y="16" class="tag-text" fill="#ffca28" text-anchor="middle">Firebase Auth</text>

    <!-- Tag 3 -->
    <rect x="209" y="0" width="90" height="24" class="tag-box"/>
    <text x="254" y="16" class="tag-text" text-anchor="middle">Node.js</text>

    <!-- Tag 4 -->
    <rect x="307" y="0" width="80" height="24" class="tag-box"/>
    <text x="347" y="16" class="tag-text" text-anchor="middle">HTML5/CSS</text>

    <!-- Link Icon -->
    <g transform="translate(450, 4)">
      <circle cx="8" cy="8" r="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M5 8 H11 M8 5 L11 8 L8 11" stroke="#10b981" stroke-width="1.5" fill="none"/>
    </g>
  </g>
</svg>
