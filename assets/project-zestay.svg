<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img">
  <title>ZeStay — Roommate &amp; PG Discovery Platform</title>
  <desc>Modern product platform connecting students and young professionals with verified accommodations and compatible roommates.</desc>
  <defs>
    <filter id="zeCardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.5; }
    .tag-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 4px; }
    .tag-text { font-family: 'SF Mono', Monaco, monospace; font-size: 9.5px; fill: #38bdf8; }
  </style>

  <rect width="520" height="320" rx="14" fill="#0b101b" stroke="#1e3a8a" stroke-width="1.2" filter="url(#zeCardGlow)"/>

  <!-- Top Category Bar -->
  <g transform="translate(26, 26)">
    <rect width="140" height="20" rx="4" fill="#172554" stroke="#1d4ed8" stroke-width="1"/>
    <text x="70" y="14" class="mono" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">PRODUCT PLATFORM</text>

    <!-- Verified Badge -->
    <g transform="translate(425, 10)">
      <circle cx="0" cy="0" r="3.5" fill="#3b82f6"/>
      <text x="8" y="3" class="mono" font-size="9.5" fill="#60a5fa">VERIFIED</text>
    </g>
  </g>

  <!-- Title & Description -->
  <g transform="translate(26, 68)">
    <text x="0" y="0" class="card-title">ZESTAY — PG &amp; ROOMMATE DISCOVERY</text>
    <text x="0" y="20" class="card-desc">Modern accommodation network connecting students and urban professionals.</text>
    <text x="0" y="36" class="card-desc">Features personality matching, geographic radii search, and verified listings.</text>
  </g>

  <!-- Illustration: Geolocation Pin & Community Matching Vector -->
  <g transform="translate(260, 195)">
    <!-- Map Radii Rings -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 4"/>
    
    <!-- Central Map Pin / House -->
    <path d="M0 -22 C-10 -22 -16 -14 -16 -4 C-16 8 0 20 0 20 C0 20 16 8 16 -4 C16 -14 10 -22 0 -22 Z" fill="#2563eb"/>
    <circle cx="0" cy="-6" r="5" fill="#ffffff"/>

    <!-- Left Match Card -->
    <g transform="translate(-155, -30)">
      <rect width="85" height="44" rx="6" fill="#172554" stroke="#2563eb" stroke-width="1"/>
      <circle cx="16" cy="18" r="7" fill="#38bdf8"/>
      <text x="32" y="16" class="mono" font-size="8" fill="#e2e8f0">ADITYA N.</text>
      <text x="32" y="28" class="mono" font-size="7.5" fill="#60a5fa">MATCH: 96%</text>
      <line x1="85" y1="22" x2="115" y2="10" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    </g>

    <!-- Right PG Listing Card -->
    <g transform="translate(75, -30)">
      <rect width="85" height="44" rx="6" fill="#172554" stroke="#2563eb" stroke-width="1"/>
      <rect x="8" y="10" width="16" height="16" rx="2" fill="#1d4ed8"/>
      <text x="32" y="16" class="mono" font-size="8" fill="#e2e8f0">CAMPUS PG</text>
      <text x="32" y="28" class="mono" font-size="7.5" fill="#34d399">0.8 KM AWAY</text>
      <line x1="-30" y1="10" x2="0" y2="22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    </g>
  </g>

  <!-- Bottom Technology Tags -->
  <g transform="translate(26, 275)">
    <rect x="0" y="0" width="85" height="24" class="tag-box"/>
    <text x="42" y="16" class="tag-text" text-anchor="middle">React / Web</text>

    <rect x="93" y="0" width="95" height="24" class="tag-box"/>
    <text x="140" y="16" class="tag-text" text-anchor="middle">Geo Location</text>

    <rect x="196" y="0" width="85" height="24" class="tag-box"/>
    <text x="238" y="16" class="tag-text" text-anchor="middle">Supabase DB</text>

    <rect x="289" y="0" width="85" height="24" class="tag-box"/>
    <text x="331" y="16" class="tag-text" text-anchor="middle">Matching ML</text>

    <g transform="translate(450, 4)">
      <circle cx="8" cy="8" r="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M5 8 H11 M8 5 L11 8 L8 11" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
    </g>
  </g>
</svg>
