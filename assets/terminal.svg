<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%">
  <title>Terminal — Aditya Mohan Nair</title>
  <desc>A macOS-style terminal window showcasing Aditya Mohan Nair's developer profile, skills, and recent projects.</desc>

  <defs>
    <!-- Outer shadow filter -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle inner glow for the window body -->
    <linearGradient id="titleBarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { animation: blink 1s step-end infinite; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <!-- Background fill (transparent outside the window) -->
  <rect width="800" height="450" fill="transparent"/>

  <!-- ==================== WINDOW FRAME ==================== -->
  <g filter="url(#shadow)">
    <!-- Window outer frame -->
    <rect x="20" y="12" width="760" height="426" rx="10" ry="10" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Title bar -->
    <rect x="20" y="12" width="760" height="38" rx="10" ry="10" fill="url(#titleBarGrad)"/>
    <!-- Bottom edge of title bar (square off the rounded bottom corners) -->
    <rect x="20" y="36" width="760" height="14" fill="url(#titleBarGrad)"/>
    <!-- Title bar bottom border -->
    <line x1="20" y1="50" x2="780" y2="50" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Traffic lights -->
    <circle cx="46" cy="31" r="6" fill="#ff5f57"/>
    <circle cx="66" cy="31" r="6" fill="#febc2e"/>
    <circle cx="86" cy="31" r="6" fill="#28c840"/>

    <!-- Title text -->
    <text x="400" y="35" text-anchor="middle" class="mono" fill="#888888" font-size="12">aditya@dev ~ /projects</text>

    <!-- Terminal body -->
    <rect x="21" y="50" width="758" height="387" fill="#0a0a0a"/>
    <!-- Subtle inner border for depth -->
    <rect x="21" y="50" width="758" height="387" fill="none" stroke="#161616" stroke-width="1"/>
    <!-- Bottom rounded corners mask -->
    <rect x="20" y="410" width="760" height="28" rx="10" ry="10" fill="#0a0a0a"/>
    <rect x="20" y="410" width="760" height="10" fill="#0a0a0a"/>
  </g>

  <!-- ==================== TERMINAL CONTENT ==================== -->
  <g class="mono" font-size="13">

    <!-- LINE 1: $ whoami -->
    <text x="42" y="78">
      <tspan fill="#666666">❯</tspan>
      <tspan fill="#22d3ee"> whoami</tspan>
    </text>
    <!-- Response -->
    <text x="42" y="96" fill="#f5f5f5">  Aditya Mohan Nair</text>

    <!-- LINE 2: $ cat skills.json -->
    <text x="42" y="122">
      <tspan fill="#666666">❯</tspan>
      <tspan fill="#22d3ee"> cat</tspan>
      <tspan fill="#e8e8e8"> skills.json</tspan>
    </text>

    <!-- JSON block -->
    <text x="42" y="140" fill="#e8e8e8">  {</text>

    <text x="42" y="156">
      <tspan fill="#e8e8e8">    </tspan>
      <tspan fill="#3b82f6">"focus"</tspan>
      <tspan fill="#e8e8e8">: [</tspan>
      <tspan fill="#10b981">"Full-Stack Dev"</tspan>
      <tspan fill="#e8e8e8">, </tspan>
      <tspan fill="#10b981">"AI/ML"</tspan>
      <tspan fill="#e8e8e8">, </tspan>
      <tspan fill="#10b981">"Health Tech"</tspan>
      <tspan fill="#e8e8e8">],</tspan>
    </text>

    <text x="42" y="172">
      <tspan fill="#e8e8e8">    </tspan>
      <tspan fill="#3b82f6">"languages"</tspan>
      <tspan fill="#e8e8e8">: [</tspan>
      <tspan fill="#10b981">"TypeScript"</tspan>
      <tspan fill="#e8e8e8">, </tspan>
      <tspan fill="#10b981">"JavaScript"</tspan>
      <tspan fill="#e8e8e8">, </tspan>
      <tspan fill="#10b981">"Python"</tspan>
      <tspan fill="#e8e8e8">],</tspan>
    </text>

    <text x="42" y="188">
      <tspan fill="#e8e8e8">    </tspan>
      <tspan fill="#3b82f6">"currently_building"</tspan>
      <tspan fill="#e8e8e8">: </tspan>
      <tspan fill="#10b981">"intelligent systems"</tspan>
      <tspan fill="#e8e8e8">,</tspan>
    </text>

    <text x="42" y="204">
      <tspan fill="#e8e8e8">    </tspan>
      <tspan fill="#3b82f6">"coffee_level"</tspan>
      <tspan fill="#e8e8e8">: </tspan>
      <tspan fill="#10b981">"critical"</tspan>
    </text>

    <text x="42" y="220" fill="#e8e8e8">  }</text>

    <!-- LINE 3: $ git log -->
    <text x="42" y="246">
      <tspan fill="#666666">❯</tspan>
      <tspan fill="#22d3ee"> git log</tspan>
      <tspan fill="#e8e8e8"> --oneline -3</tspan>
    </text>

    <text x="42" y="264">
      <tspan fill="#f59e0b">  a1b2c3d</tspan>
      <tspan fill="#e8e8e8"> feat: add gesture control module</tspan>
    </text>
    <text x="42" y="280">
      <tspan fill="#f59e0b">  e4f5g6h</tspan>
      <tspan fill="#e8e8e8"> fix: therapist matching algorithm</tspan>
    </text>
    <text x="42" y="296">
      <tspan fill="#f59e0b">  i7j8k9l</tspan>
      <tspan fill="#e8e8e8"> init: habit tracker with gamification</tspan>
    </text>

    <!-- LINE 4: $ echo $STATUS -->
    <text x="42" y="322">
      <tspan fill="#666666">❯</tspan>
      <tspan fill="#22d3ee"> echo</tspan>
      <tspan fill="#8b5cf6"> $STATUS</tspan>
    </text>

    <text x="42" y="340" fill="#10b981">  building something cool...</text>

    <!-- LINE 5: Empty prompt with blinking cursor -->
    <text x="42" y="368">
      <tspan fill="#666666">❯</tspan>
      <tspan fill="#e8e8e8"> </tspan>
    </text>
    <!-- Blinking block cursor -->
    <rect x="54" y="357" width="8" height="15" rx="1" ry="1" fill="#f5f5f5" class="cursor"/>

    <!-- Subtle bottom-right branding -->
    <text x="748" y="420" text-anchor="end" fill="#333333" font-size="10" class="mono">@A2ZCoder404</text>
  </g>
</svg>
