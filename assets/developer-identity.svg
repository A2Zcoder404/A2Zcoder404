<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%">
  <title>Developer Identity — Aditya Mohan Nair</title>
  <desc>A premium abstract illustration representing Computer Engineering, AI, Full-Stack Development, and Data — with circuit traces, neural network nodes, code brackets, and database shapes.</desc>

  <defs>
    <!-- Subtle shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="1" result="shifted"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.12" result="color"/>
      <feComposite in="color" in2="shifted" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Small glow for accent nodes -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.4" fill="#2a2a2a"/>
      <circle cx="40" cy="0" r="0.4" fill="#2a2a2a"/>
      <circle cx="0" cy="40" r="0.4" fill="#2a2a2a"/>
      <circle cx="40" cy="40" r="0.4" fill="#2a2a2a"/>
      <circle cx="20" cy="20" r="0.3" fill="#1e1e1e"/>
    </pattern>

    <!-- Gradient for accent line -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="traceGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .label {
      font-family: 'Courier New', Courier, monospace;
      font-size: 8px;
      letter-spacing: 2px;
      fill: #888888;
    }
    .label-accent {
      font-family: 'Courier New', Courier, monospace;
      font-size: 8px;
      letter-spacing: 2px;
      fill: #3b82f6;
    }
    .node-pulse {
      animation: pulse 4s ease-in-out infinite;
    }
    .node-pulse-delay {
      animation: pulse 4s ease-in-out 1.5s infinite;
    }
    .node-pulse-delay2 {
      animation: pulse 4s ease-in-out 3s infinite;
    }
    .trace-anim {
      stroke-dasharray: 8 12;
      animation: dash 6s linear infinite;
    }
    .trace-anim-slow {
      stroke-dasharray: 4 16;
      animation: dash 10s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="300" fill="#0a0a0a" rx="0"/>
  <rect width="800" height="300" fill="url(#grid)" rx="0"/>

  <!-- === CORNER MARKS === -->
  <!-- Top-left -->
  <line x1="12" y1="12" x2="32" y2="12" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="12" y1="12" x2="12" y2="32" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Top-right -->
  <line x1="788" y1="12" x2="768" y2="12" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="788" y1="12" x2="788" y2="32" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Bottom-left -->
  <line x1="12" y1="288" x2="32" y2="288" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="12" y1="288" x2="12" y2="268" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Bottom-right -->
  <line x1="788" y1="288" x2="768" y2="288" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="788" y1="288" x2="788" y2="268" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Corner dots -->
  <circle cx="12" cy="12" r="1.5" fill="#333333"/>
  <circle cx="788" cy="12" r="1.5" fill="#333333"/>
  <circle cx="12" cy="288" r="1.5" fill="#333333"/>
  <circle cx="788" cy="288" r="1.5" fill="#333333"/>

  <!-- === CIRCUIT TRACES (horizontal backbone) === -->
  <line x1="60" y1="150" x2="740" y2="150" stroke="url(#traceGrad)" stroke-width="0.5"/>
  <line x1="100" y1="90" x2="700" y2="90" stroke="#1e1e1e" stroke-width="0.5" class="trace-anim-slow"/>
  <line x1="120" y1="210" x2="680" y2="210" stroke="#1e1e1e" stroke-width="0.5" class="trace-anim-slow"/>

  <!-- Vertical trace accents -->
  <line x1="200" y1="50" x2="200" y2="250" stroke="url(#traceGradV)" stroke-width="0.5"/>
  <line x1="400" y1="40" x2="400" y2="260" stroke="url(#traceGradV)" stroke-width="0.5"/>
  <line x1="600" y1="50" x2="600" y2="250" stroke="url(#traceGradV)" stroke-width="0.5"/>

  <!-- === SECTION 1: CODE (Left zone, ~x:60-220) === -->
  <!-- Code brackets -->
  <g filter="url(#shadow)">
    <!-- Opening bracket < /> -->
    <text x="80" y="120" font-family="'Courier New', Courier, monospace" font-size="36" fill="#f5f5f5" opacity="0.15" font-weight="bold">&lt;</text>
    <text x="150" y="120" font-family="'Courier New', Courier, monospace" font-size="36" fill="#f5f5f5" opacity="0.15" font-weight="bold">/&gt;</text>
    <!-- Curly braces -->
    <text x="100" y="175" font-family="'Courier New', Courier, monospace" font-size="52" fill="#f5f5f5" opacity="0.07" font-weight="bold">{</text>
    <text x="170" y="175" font-family="'Courier New', Courier, monospace" font-size="52" fill="#f5f5f5" opacity="0.07" font-weight="bold">}</text>
  </g>

  <!-- Code lines representation -->
  <rect x="95" y="130" width="45" height="2" rx="1" fill="#333333" opacity="0.6"/>
  <rect x="95" y="137" width="70" height="2" rx="1" fill="#3b82f6" opacity="0.3"/>
  <rect x="95" y="144" width="55" height="2" rx="1" fill="#333333" opacity="0.4"/>
  <rect x="105" y="151" width="40" height="2" rx="1" fill="#333333" opacity="0.5"/>
  <rect x="105" y="158" width="60" height="2" rx="1" fill="#3b82f6" opacity="0.15"/>
  <rect x="95" y="165" width="35" height="2" rx="1" fill="#333333" opacity="0.3"/>

  <!-- Terminal cursor blinking -->
  <rect x="82" y="130" width="7" height="2" rx="1" fill="#3b82f6" opacity="0.7" class="node-pulse"/>

  <!-- Label: CODE -->
  <text x="110" y="200" class="label" text-anchor="middle">CODE</text>

  <!-- Circuit nodes near CODE -->
  <circle cx="80" cy="90" r="2" fill="none" stroke="#333333" stroke-width="0.8"/>
  <circle cx="80" cy="90" r="0.8" fill="#888888"/>
  <line x1="80" y1="92" x2="80" y2="128" stroke="#333333" stroke-width="0.5" class="trace-anim"/>
  <circle cx="180" cy="210" r="2" fill="none" stroke="#333333" stroke-width="0.8"/>
  <circle cx="180" cy="210" r="0.8" fill="#888888"/>
  <line x1="180" y1="202" x2="180" y2="175" stroke="#333333" stroke-width="0.5"/>

  <!-- === SECTION 2: AI / Neural Network (Center-left, ~x:220-400) === -->
  <!-- Neural network nodes layer 1 -->
  <circle cx="260" cy="80" r="4" fill="none" stroke="#888888" stroke-width="0.8"/>
  <circle cx="260" cy="80" r="1.5" fill="#888888" class="node-pulse"/>
  <circle cx="260" cy="130" r="4" fill="none" stroke="#888888" stroke-width="0.8"/>
  <circle cx="260" cy="130" r="1.5" fill="#888888" class="node-pulse-delay"/>
  <circle cx="260" cy="180" r="4" fill="none" stroke="#888888" stroke-width="0.8"/>
  <circle cx="260" cy="180" r="1.5" fill="#888888" class="node-pulse"/>
  <circle cx="260" cy="230" r="4" fill="none" stroke="#888888" stroke-width="0.8"/>
  <circle cx="260" cy="230" r="1.5" fill="#888888" class="node-pulse-delay2"/>

  <!-- Neural network nodes layer 2 -->
  <circle cx="330" cy="105" r="5" fill="none" stroke="#3b82f6" stroke-width="0.8" filter="url(#glow)"/>
  <circle cx="330" cy="105" r="2" fill="#3b82f6" opacity="0.8" class="node-pulse-delay"/>
  <circle cx="330" cy="155" r="5" fill="none" stroke="#3b82f6" stroke-width="0.8" filter="url(#glow)"/>
  <circle cx="330" cy="155" r="2" fill="#3b82f6" opacity="0.8" class="node-pulse"/>
  <circle cx="330" cy="205" r="5" fill="none" stroke="#3b82f6" stroke-width="0.8" filter="url(#glow)"/>
  <circle cx="330" cy="205" r="2" fill="#3b82f6" opacity="0.8" class="node-pulse-delay2"/>

  <!-- Neural network nodes layer 3 -->
  <circle cx="390" cy="130" r="4" fill="none" stroke="#888888" stroke-width="0.8"/>
  <circle cx="390" cy="130" r="1.5" fill="#888888" class="node-pulse-delay2"/>
  <circle cx="390" cy="180" r="4" fill="none" stroke="#888888" stroke-width="0.8"/>
  <circle cx="390" cy="180" r="1.5" fill="#888888" class="node-pulse"/>

  <!-- Connections layer 1 → 2 -->
  <line x1="264" y1="80" x2="325" y2="105" stroke="#333333" stroke-width="0.4" opacity="0.5"/>
  <line x1="264" y1="80" x2="325" y2="155" stroke="#333333" stroke-width="0.3" opacity="0.3"/>
  <line x1="264" y1="130" x2="325" y2="105" stroke="#333333" stroke-width="0.4" opacity="0.5"/>
  <line x1="264" y1="130" x2="325" y2="155" stroke="#333333" stroke-width="0.4" opacity="0.5"/>
  <line x1="264" y1="130" x2="325" y2="205" stroke="#333333" stroke-width="0.3" opacity="0.3"/>
  <line x1="264" y1="180" x2="325" y2="105" stroke="#333333" stroke-width="0.3" opacity="0.3"/>
  <line x1="264" y1="180" x2="325" y2="155" stroke="#333333" stroke-width="0.4" opacity="0.5"/>
  <line x1="264" y1="180" x2="325" y2="205" stroke="#333333" stroke-width="0.4" opacity="0.5"/>
  <line x1="264" y1="230" x2="325" y2="155" stroke="#333333" stroke-width="0.3" opacity="0.3"/>
  <line x1="264" y1="230" x2="325" y2="205" stroke="#333333" stroke-width="0.4" opacity="0.5"/>

  <!-- Connections layer 2 → 3 -->
  <line x1="335" y1="105" x2="386" y2="130" stroke="#3b82f6" stroke-width="0.4" opacity="0.25"/>
  <line x1="335" y1="105" x2="386" y2="180" stroke="#333333" stroke-width="0.3" opacity="0.3"/>
  <line x1="335" y1="155" x2="386" y2="130" stroke="#3b82f6" stroke-width="0.4" opacity="0.25"/>
  <line x1="335" y1="155" x2="386" y2="180" stroke="#3b82f6" stroke-width="0.4" opacity="0.25"/>
  <line x1="335" y1="205" x2="386" y2="130" stroke="#333333" stroke-width="0.3" opacity="0.3"/>
  <line x1="335" y1="205" x2="386" y2="180" stroke="#3b82f6" stroke-width="0.4" opacity="0.25"/>

  <!-- Label: AI -->
  <text x="330" y="250" class="label-accent" text-anchor="middle">AI</text>

  <!-- Brain/chip outline (subtle) -->
  <rect x="310" y="140" width="40" height="30" rx="3" fill="none" stroke="#2a2a2a" stroke-width="0.5" stroke-dasharray="2 3"/>

  <!-- === SECTION 3: WEB / Full-Stack (Center, ~x:420-580) === -->
  <!-- Browser window abstraction -->
  <g filter="url(#shadow)">
    <rect x="440" y="70" width="120" height="80" rx="6" fill="#161616" stroke="#2a2a2a" stroke-width="0.8"/>
    <!-- Title bar -->
    <rect x="440" y="70" width="120" height="14" rx="6" fill="#1e1e1e"/>
    <rect x="440" y="78" width="120" height="6" fill="#1e1e1e"/>
    <!-- Window dots -->
    <circle cx="450" cy="77" r="2" fill="#f5f5f5" opacity="0.15"/>
    <circle cx="457" cy="77" r="2" fill="#f5f5f5" opacity="0.15"/>
    <circle cx="464" cy="77" r="2" fill="#f5f5f5" opacity="0.15"/>
    <!-- URL bar -->
    <rect x="472" y="74" width="80" height="6" rx="2" fill="#252525"/>
    <!-- Content lines -->
    <rect x="450" y="92" width="50" height="3" rx="1" fill="#333333" opacity="0.5"/>
    <rect x="450" y="100" width="80" height="2" rx="1" fill="#2a2a2a" opacity="0.5"/>
    <rect x="450" y="106" width="65" height="2" rx="1" fill="#2a2a2a" opacity="0.4"/>
    <rect x="450" y="112" width="90" height="2" rx="1" fill="#2a2a2a" opacity="0.3"/>
    <!-- Content block -->
    <rect x="450" y="120" width="40" height="20" rx="2" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="0.5"/>
    <rect x="496" y="120" width="55" height="20" rx="2" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="0.5"/>
    <!-- Button accent -->
    <rect x="450" y="123" width="36" height="5" rx="2" fill="#3b82f6" opacity="0.2"/>
  </g>

  <!-- Server/API representation below browser -->
  <line x1="500" y1="150" x2="500" y2="175" stroke="#333333" stroke-width="0.5" stroke-dasharray="3 3"/>
  <circle cx="500" cy="175" r="2" fill="none" stroke="#888888" stroke-width="0.8"/>
  <circle cx="500" cy="175" r="0.8" fill="#888888"/>
  <!-- API arrows -->
  <line x1="498" y1="160" x2="500" y2="155" stroke="#333333" stroke-width="0.5"/>
  <line x1="502" y1="160" x2="500" y2="155" stroke="#333333" stroke-width="0.5"/>

  <!-- Component tree abstraction -->
  <line x1="500" y1="177" x2="480" y2="195" stroke="#333333" stroke-width="0.5"/>
  <line x1="500" y1="177" x2="520" y2="195" stroke="#333333" stroke-width="0.5"/>
  <rect x="472" y="195" width="16" height="10" rx="2" fill="none" stroke="#2a2a2a" stroke-width="0.6"/>
  <rect x="512" y="195" width="16" height="10" rx="2" fill="none" stroke="#2a2a2a" stroke-width="0.6"/>
  <line x1="480" y1="205" x2="475" y2="215" stroke="#2a2a2a" stroke-width="0.4"/>
  <line x1="480" y1="205" x2="485" y2="215" stroke="#2a2a2a" stroke-width="0.4"/>

  <!-- Label: WEB -->
  <text x="500" y="240" class="label" text-anchor="middle">WEB</text>

  <!-- React-ish orbit hint -->
  <ellipse cx="500" cy="110" rx="70" ry="12" fill="none" stroke="#2a2a2a" stroke-width="0.3" transform="rotate(-15 500 110)"/>

  <!-- === SECTION 4: DATA (Right zone, ~x:600-740) === -->
  <!-- Database cylinder -->
  <g filter="url(#shadow)">
    <ellipse cx="670" cy="90" rx="32" ry="8" fill="#161616" stroke="#2a2a2a" stroke-width="0.8"/>
    <rect x="638" y="90" width="64" height="40" fill="#161616" stroke="none"/>
    <line x1="638" y1="90" x2="638" y2="130" stroke="#2a2a2a" stroke-width="0.8"/>
    <line x1="702" y1="90" x2="702" y2="130" stroke="#2a2a2a" stroke-width="0.8"/>
    <ellipse cx="670" cy="130" rx="32" ry="8" fill="#161616" stroke="#2a2a2a" stroke-width="0.8"/>
    <!-- Data rows -->
    <ellipse cx="670" cy="103" rx="28" ry="5" fill="none" stroke="#252525" stroke-width="0.5"/>
    <ellipse cx="670" cy="116" rx="28" ry="5" fill="none" stroke="#252525" stroke-width="0.5"/>
    <!-- Accent row -->
    <line x1="650" y1="103" x2="690" y2="103" stroke="#3b82f6" stroke-width="0.3" opacity="0.3"/>
  </g>

  <!-- Data flow dots -->
  <circle cx="670" cy="145" r="1.5" fill="#888888" class="node-pulse"/>
  <circle cx="670" cy="155" r="1.5" fill="#888888" class="node-pulse-delay"/>
  <circle cx="670" cy="165" r="1.5" fill="#888888" class="node-pulse-delay2"/>

  <!-- Data table abstraction -->
  <g opacity="0.5">
    <rect x="640" y="175" width="60" height="35" rx="3" fill="none" stroke="#2a2a2a" stroke-width="0.6"/>
    <line x1="640" y1="183" x2="700" y2="183" stroke="#2a2a2a" stroke-width="0.4"/>
    <line x1="660" y1="175" x2="660" y2="210" stroke="#2a2a2a" stroke-width="0.3"/>
    <!-- Cells -->
    <rect x="643" y="177" width="14" height="3" rx="1" fill="#333333" opacity="0.5"/>
    <rect x="663" y="177" width="20" height="3" rx="1" fill="#333333" opacity="0.5"/>
    <rect x="643" y="187" width="10" height="2" rx="1" fill="#2a2a2a"/>
    <rect x="663" y="187" width="30" height="2" rx="1" fill="#2a2a2a"/>
    <rect x="643" y="193" width="12" height="2" rx="1" fill="#2a2a2a"/>
    <rect x="663" y="193" width="25" height="2" rx="1" fill="#2a2a2a"/>
    <rect x="643" y="199" width="8" height="2" rx="1" fill="#2a2a2a"/>
    <rect x="663" y="199" width="28" height="2" rx="1" fill="#3b82f6" opacity="0.15"/>
  </g>

  <!-- Label: DATA -->
  <text x="670" y="235" class="label" text-anchor="middle">DATA</text>

  <!-- Data circuit nodes -->
  <circle cx="720" cy="90" r="2" fill="none" stroke="#333333" stroke-width="0.8"/>
  <circle cx="720" cy="90" r="0.8" fill="#888888"/>
  <line x1="702" y1="90" x2="718" y2="90" stroke="#333333" stroke-width="0.5"/>
  <line x1="720" y1="92" x2="720" y2="150" stroke="#333333" stroke-width="0.4" class="trace-anim"/>
  <circle cx="720" cy="150" r="2" fill="none" stroke="#333333" stroke-width="0.8"/>
  <circle cx="720" cy="150" r="0.8" fill="#888888"/>

  <!-- === INTER-SECTION CONNECTIONS === -->
  <!-- CODE → AI -->
  <path d="M 190 150 Q 225 130 255 130" fill="none" stroke="#333333" stroke-width="0.5" class="trace-anim"/>
  <!-- AI → WEB -->
  <path d="M 394 155 Q 415 140 440 110" fill="none" stroke="#333333" stroke-width="0.5" class="trace-anim"/>
  <!-- WEB → DATA -->
  <path d="M 560 110 Q 600 100 638 100" fill="none" stroke="#333333" stroke-width="0.5" class="trace-anim"/>

  <!-- === FLOATING GEOMETRIC ACCENTS === -->
  <!-- Small squares scattered -->
  <rect x="55" y="45" width="4" height="4" rx="0.5" fill="none" stroke="#2a2a2a" stroke-width="0.5" transform="rotate(45 57 47)"/>
  <rect x="740" y="55" width="3" height="3" rx="0.5" fill="none" stroke="#2a2a2a" stroke-width="0.5" transform="rotate(45 741.5 56.5)"/>
  <rect x="350" y="40" width="3" height="3" rx="0.5" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
  <rect x="550" y="250" width="4" height="4" rx="0.5" fill="none" stroke="#2a2a2a" stroke-width="0.5" transform="rotate(45 552 252)"/>

  <!-- Small plus signs -->
  <g stroke="#2a2a2a" stroke-width="0.6" opacity="0.5">
    <line x1="145" y1="55" x2="145" y2="61"/>
    <line x1="142" y1="58" x2="148" y2="58"/>
  </g>
  <g stroke="#2a2a2a" stroke-width="0.6" opacity="0.5">
    <line x1="620" y1="260" x2="620" y2="266"/>
    <line x1="617" y1="263" x2="623" y2="263"/>
  </g>
  <g stroke="#2a2a2a" stroke-width="0.6" opacity="0.4">
    <line x1="420" y1="265" x2="420" y2="271"/>
    <line x1="417" y1="268" x2="423" y2="268"/>
  </g>

  <!-- Tiny scattered dots (circuit board feel) -->
  <circle cx="310" cy="60" r="1" fill="#2a2a2a"/>
  <circle cx="460" cy="260" r="1" fill="#2a2a2a"/>
  <circle cx="750" cy="200" r="1" fill="#2a2a2a"/>
  <circle cx="50" cy="200" r="1" fill="#2a2a2a"/>
  <circle cx="230" cy="260" r="1" fill="#2a2a2a"/>
  <circle cx="140" cy="250" r="1" fill="#2a2a2a"/>

  <!-- Hexagon accent (chip/hardware feel) -->
  <polygon points="50,150 56,143 68,143 74,150 68,157 56,157" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
  <circle cx="62" cy="150" r="1.5" fill="#2a2a2a"/>

  <!-- Right side terminal bracket -->
  <text x="740" y="162" font-family="'Courier New', Courier, monospace" font-size="18" fill="#f5f5f5" opacity="0.06">$_</text>

  <!-- === BOTTOM SUBTLE BORDER === -->
  <line x1="100" y1="280" x2="700" y2="280" stroke="#1e1e1e" stroke-width="0.5"/>
  <circle cx="100" cy="280" r="1" fill="#2a2a2a"/>
  <circle cx="700" cy="280" r="1" fill="#2a2a2a"/>

  <!-- === VERY SUBTLE SIGNATURE LINE === -->
  <text x="400" y="293" font-family="'Courier New', Courier, monospace" font-size="6" fill="#333333" text-anchor="middle" letter-spacing="3">A2ZCODER404</text>
</svg>