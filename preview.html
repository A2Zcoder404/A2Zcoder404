<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya Nair (@A2ZCoder404) — Avi Vashishta Design Architecture</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --card-bg: #f6f8fa;
      --border: #d0d7de;
      --text-main: #1f2328;
      --text-muted: #656d76;
      --accent: #0969da;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      padding-bottom: 80px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    [data-theme="light"] .toolbar { background: rgba(255, 255, 255, 0.9); }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 14px;
    }
    .badge {
      background: #2f55ff;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .container {
      max-width: 880px;
      margin: 36px auto;
      padding: 0 16px;
    }

    .readme-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    .card-row {
      display: flex;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    .card-row a, .card-row img {
      display: block;
      margin: 0;
      padding: 0;
    }

    details {
      margin-top: 36px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--text-main);
    }
  </style>
</head>

  <script>
    function toggleTheme() {
      const body = document.body;
      const btn = document.getElementById('theme-btn');
      if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        btn.innerText = '🌙 Dark Mode';
      } else {
        body.setAttribute('data-theme', 'dark');
        btn.innerText = '☀️ Light Mode';
      }
    }
  </script>
